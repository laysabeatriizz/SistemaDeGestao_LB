name: Backend CI & SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-coverage:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: concessionaria_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DB_URL: jdbc:mysql://localhost:3306/concessionaria_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      TEST_DB_USERNAME: root
      TEST_DB_PASSWORD: test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x backend/mvnw

      - name: Aguardar o MySQL ficar pronto
        run: |
          echo "Aguardando o MySQL subir na porta 3306..."
          until nc -z -v -w30 localhost 3306; do
            echo "Ainda aguardando o banco..."
            sleep 2
          done
          echo "MySQL pronto para conexões!"

      - name: Executar build, testes e cobertura do backend
        working-directory: backend
        run: |
          ./mvnw clean verify \
            -Dspring.profiles.active=test

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Executar testes e cobertura do frontend
        working-directory: frontend
        run: npm test -- --no-watch --no-progress --coverage --coverage-reporters=lcovonly

      - name: Executar build do frontend
        working-directory: frontend
        run: npm run build

      - name: Executar análise do Sonar
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd backend
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dspring.profiles.active=test \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=sistema-concessionaria-de-veiculos \
            -Dsonar.projectKey=SistemaDeGestao \
            -Dsonar.sources=src/main/java,../frontend/src \
            -Dsonar.tests=src/test \
            -Dsonar.test.inclusions=../frontend/src/**/*.spec.ts \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.javascript.lcov.reportPaths=../frontend/coverage/frontend/lcov.info